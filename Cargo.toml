[package]
name = "mdview"
version = "0.2.0"
edition = "2024"
# let-chains(`if let ... && ...`)를 쓰므로 1.88 이상이 필요하다.
rust-version = "1.88"
license = "MIT"
description = "Terminal markdown viewer like glow"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.2"
ureq = "3.4.1"
